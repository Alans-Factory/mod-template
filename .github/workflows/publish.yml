name: Publish Factorio Mod

on:
  push:
    branches:
      - main

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check published version
        id: check
        run: bash .github/scripts/check-published-version.sh

  test:
    needs: release-check
    if: needs.release-check.outputs.publish == 'true'
    uses: ./.github/workflows/test.yml

  publish-mod:
    needs: [release-check, test]
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read mod info
        run: bash .github/scripts/read-mod-info.sh

      - name: Create zip
        run: bash .github/scripts/create-mod-zip.sh

      - name: Upload Mod
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: bash .github/scripts/upload-mod.sh
